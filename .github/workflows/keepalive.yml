name: Keepalive Workflow
on:
  schedule:
    - cron: '0 0 1 * *'   # يشتغل أول كل شهر
  workflow_dispatch:

jobs:
  keepalive-job:
    name: Keepalive Workflow
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
